# Pet roster - one PREFIX=NAME per line, listed in selection-screen order.
# PREFIX is the decimal sprite prefix of the pet's PPAAFF.PCX files, so a
# line here needs matching sprites on the badge (0 -> 00xxxx.PCX, and so on).
# 3 (sponsors) and 4 (menu icons) are reserved and ignored; names are cut at
# 16 characters. No pet is built into the firmware: remove a line and that
# pet disappears from the badge, empty this file and none can be picked.
0=Bartholomeus
1=Cat
2=Slug
5=Panda
6=Badger
